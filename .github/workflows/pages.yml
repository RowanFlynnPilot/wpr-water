name: deploy-pages
on:
  push:
    branches: [master]
  # weekly-data-refresh pushes with GITHUB_TOKEN, which cannot trigger a push
  # event — but workflow_run still fires. This publishes the moment a refresh
  # lands, whichever of its staggered attempts succeeded, instead of guessing
  # an hour offset.
  workflow_run:
    workflows: ["weekly-data-refresh"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Don't publish after a refresh that failed; the last good data stays live.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Assemble site (widget at root, data alongside)
        run: |
          mkdir -p _site/data/processed
          cp -r web/dist/. _site/
          cp data/processed/*.json _site/data/processed/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
