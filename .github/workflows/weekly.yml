name: weekly-data-refresh
on:
  schedule:
    # Three staggered Sunday attempts, each on a fresh runner.
    #
    # Diagnosed 2026-08-30: some GitHub Actions runner IPs cannot reach
    # apps.dnr.wi.gov at all — TCP connects are silently dropped, so DNR is
    # filtering part of the Azure pool. The portal is fine from elsewhere, and
    # a failed run re-run on a new runner succeeds immediately. Retrying
    # in-process cannot help (same IP), so the retry has to be a new run.
    # Later attempts no-op when the data is already fresh, so DNR sees one
    # pull per week in the normal case.
    - cron: "0 15 * * 0"
    - cron: "0 18 * * 0"
    - cron: "0 21 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.check.outputs.stale }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        name: Skip if the data was already refreshed today
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch — refreshing regardless of data age."
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          built=$(python -c "import json; print(json.load(open('data/processed/summary.json'))['built_at'][:10])")
          today=$(date -u +%F)
          if [ "$built" = "$today" ]; then
            echo "Data already refreshed today ($built) — nothing to do."
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "Data last built $built, today is $today — refreshing."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: check
    if: needs.check.outputs.stale == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m scrapers.dws_pfas_results
      - run: python -m scrapers.dws_chem_results
      - run: python -m scrapers.dnr_fish_advisories
      - run: python -m scrapers.dnr_pfas_sites
      - run: python -m scrapers.echo_sdwa
      - run: python -m scrapers.uwsp_private_wells
      - run: python -m scrapers.dnr_brrts_sites
      - run: python -m scrapers.sdwis_water_systems
      - run: python -m scrapers.sdwis_violations
      - run: python -m scrapers.sdwis_enforcement
      - run: python -m transforms.build_water
      - name: Commit refreshed data
        run: |
          git config user.name "wpr-water-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Weekly data refresh"
          git push
      - name: Close prior failure issues
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --state open --search '"Weekly data refresh failed" in:title' --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Resolved automatically: a later attempt refreshed the data successfully."
          done
      # Only alert once a Sunday, after the last scheduled attempt has failed.
      # Earlier failures are expected to self-heal on the next attempt.
      - name: Open an issue on failure
        if: failure() && (github.event.schedule == '0 21 * * 0' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Weekly data refresh failed $(date -u +%Y-%m-%d)" \
            --body "All scheduled attempts failed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          If this is the usual \`apps.dnr.wi.gov\` connect timeout, the runner's IP is being dropped by DNR — re-running the job on a fresh runner normally succeeds. The live widget keeps serving the last good data until then."
